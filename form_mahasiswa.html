
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Isian Data Mahasiswa</title>
</head>
<body>
    <h2 align="center">Form Isian Data Mahasiswa</h2>

    <form method="post" action="#">
        <table border="1" cellpadding="8"
               cellspacing="0" align="center">
            <tr>
                <td>Nama</td>
                <td>
                    <input type="text" name="nama" value="Siti Wardah Musyarofah"
                           placeholder="Masukkan nama" required>
                </td>
            </tr>
            <tr>
                <td>NIM</td>
                <td>
                    <input type="text" name="nim" value="25040029"
                           placeholder="Masukkan NIM" required>
                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td>
                    <input type="email" name="email" value="sitiwardahmusyarofah41@gmail.com"
                           placeholder="Masukkan email" required>
                </td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <input type="radio" name="jk"
                           value="Laki-laki" required>
                    Laki-laki
                    <input type="radio" name="jk"
                           value="Perempuan">
                    Perempuan
                </td>
            </tr>
            <tr>
                <td>Hobi</td>
                <td>
                    <input type="checkbox" name="hobi[]"
                           value="Membaca"> Membaca<br>
                    <input type="checkbox" name="hobi[]"
                           value="Olahraga"> Olahraga<br>
                    <input type="checkbox" name="hobi[]"
                           value="Musik"> Musik
                </td>
            </tr>
            <tr>
                <td>Program Studi</td>
                <td>
                    <select name="prodi" required>
                        <option value="">-- Pilih Program Studi --</option>
                        <option value="Informatika">Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Manajemen">Manajemen</option>
                        <option value="Akuntansi">Akuntansi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td>
                    <textarea name="alamat" rows="4"
                              cols="30"
                              placeholder="Masukkan alamat"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
